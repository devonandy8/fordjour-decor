<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire Me | Fordjour Decor</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      .hire-section {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        padding: 40px 10px;
      }
      .hire-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
      }
      .hire-card h2 {
        color: #f7cd00;
        font-size: 2rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .hire-card label {
        font-weight: 500;
        margin-bottom: 0.3rem;
        color: #333;
      }
      .hire-card input,
      .hire-card textarea,
      .hire-card select {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #eee;
        border-radius: 6px;
        font-size: 1rem;
        margin-bottom: 0.7rem;
        background: #fff;
        resize: vertical;
      }
      .hire-card textarea {
        min-height: 100px;
      }
      .hire-card button {
        background: #f7cd00;
        color: #333;
        border: none;
        padding: 0.9rem 0;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .hire-card button:hover {
        background: #333;
        color: #f7cd00;
      }
      .hire-tips {
        background: #fffbe6;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        font-size: 1rem;
        color: #333;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .hire-info {
        text-align: center;
        margin-top: 2rem;
        color: #333;
      }
      .hire-info i {
        color: #f7cd00;
        margin-right: 0.5rem;
      }
      @media (max-width: 600px) {
        .hire-card {
          padding: 1.2rem 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="index.html">
        <div class="logo">
          <i class="bx bx-paint-roll"></i>
          <span>Fordjour Decor</span>
        </div>
      </a>
      <button class="nav-toggle" aria-label="Open navigation">
        <i class="bx bx-menu"></i>
      </button>
      <div class="links">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html">Contact Us</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="portfolio.html">Our Works</a></li>
          <li><a href="hire.html" class="active hire">Hire Me</a></li>
        </ul>
      </div>
    </nav>
    <section class="hire-section">
      <div class="hire-tips">
        <strong>Ready to transform your space?</strong><br />
        Fill out the form below with your project details. The more info you
        provide, the better we can serve you!
      </div>
      <form class="hire-card">
        <h2>Hire Me</h2>
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required />

        <label for="project-type">Project Type</label>
        <select id="project-type" name="project-type" required>
          <option value="">Select type</option>
          <option value="interior">Interior Painting</option>
          <option value="exterior">Exterior Painting</option>
          <option value="wallpaper">Wallpaper Installation</option>
          <option value="consultation">Decor Consultation</option>
          <option value="other">Other</option>
        </select>

        <label for="budget">Estimated Budget (GHS)</label>
        <input
          type="number"
          id="budget"
          name="budget"
          min="0"
          placeholder="e.g. 2000"
        />

        <label for="start-date">Preferred Start Date</label>
        <input type="date" id="start-date" name="start-date" />

        <label for="details">Project Details</label>
        <textarea
          id="details"
          name="details"
          placeholder="Describe your project, goals, and any special requests..."
          required
        ></textarea>

        <button type="submit">Request a Quote</button>
      </form>
    </section>
    <script src="script.js"></script>
  </body>
</html>
